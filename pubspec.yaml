name: flight_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  carousel_slider: ^5.0.0
  change_case: ^2.2.0
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  firebase_auth: ^6.3.0
  firebase_core: ^4.4.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_form_builder: ^10.1.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  flutter_sticky_header: ^0.8.0
  flutter_svg: ^2.2.3
  flutter_svg_provider: ^1.0.7
  flutter_timer_countdown: ^1.0.7
  font_awesome_flutter: ^10.12.0
  form_builder_validators: ^11.2.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  get: ^4.6.6
  http: ^1.6.0
  intl: any
  markdown_widget: ^2.3.2+8
  overlay_tooltip: ^0.2.3
  path: ^1.9.1
  path_provider: ^2.1.5
  photo_view: ^0.15.0
  pinput: ^6.0.1
  remove: ^1.0.10
  scroll_to_hide: ^2.2.1
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  sqflite: ^2.4.2
  url_launcher: ^6.3.1
  zoom_tap_animation: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/images/
    - assets/images/intro/
    - assets/images/empty/
    - assets/images/logos/
    - assets/fonts/

  fonts:
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/Ubuntu-Regular.ttf
        - asset: assets/fonts/Ubuntu-Medium.ttf
          weight: 500
        - asset: assets/fonts/Ubuntu-Bold.ttf
          weight: 700

